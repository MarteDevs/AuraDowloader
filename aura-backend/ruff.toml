target-version = "py310"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (let formatter handle)
    "B008",  # do not perform function calls in argument defaults
    "E402",  # module level import not at top — we intentionally load .env first
    "F401",  # unused imports in __init__.py (re-exports)
]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are fine in tests
"app/models/__init__.py" = ["F401"]  # intentional re-export

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
